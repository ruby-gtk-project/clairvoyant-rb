name: Drive and validate

# Runs the port's own checks on every push and PR, which until now only ever
# ran when someone remembered to run them by hand: test/drive_main_window.rb
# (the app itself, under a virtual display) and test/validate_packaging.rb
# (the desktop entry and AppStream metainfo this port's flake.nix merges at
# build time, which nothing had ever exercised).

on:
  push:
  pull_request:

jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Drive the app under a virtual display
        run: nix develop --command xvfb-run -a ruby test/drive_main_window.rb

      - name: Validate the desktop entry and AppStream metainfo
        run: nix develop --command ruby test/validate_packaging.rb
