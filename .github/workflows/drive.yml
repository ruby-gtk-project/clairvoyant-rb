name: Drive and validate

# Runs the port's own checks on every push and PR, through `rake test` (which
# the gemspec/Rakefile/dev-shell banner also point a human at):
# test/validate_packaging.rb (the desktop entry and AppStream metainfo this
# port's flake.nix merges at build time, validated with the real
# desktop-file-validate/appstreamcli tools upstream's meson tests invoke)
# then test/drive_main_window.rb (the app itself, under a virtual display).

on:
  push:
  pull_request:

jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run the port's test suite (rake test: validate_packaging + drive_main_window)
        run: nix develop --command rake test
